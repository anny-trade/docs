name: Deploy docs                                                                                                                                 
on:                                                                                                                                               
  push:                                                         
    branches: [main]                                                                                                                              
                                                                
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:                                                                                                                                  
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}                                                                                               
    runs-on: ubuntu-latest                                      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so git-revision-date-localized reads real per-file dates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs build --site-dir site                       
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4                                                                                                             
        id: deployment
